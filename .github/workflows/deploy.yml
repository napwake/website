name: Deploy

# Builds napwake.dev and publishes it with GitHub Pages, on every push to main and when run by hand.
# Pages' source must be "GitHub Actions" in the repo's settings, with the custom domain napwake.dev
# (public/CNAME says the same).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing by default. Each job asks for only what it needs.
permissions: {}

# One deploy at a time. A newer push waits for the one under way, rather than cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      urls: ${{ steps.urls.outputs.urls }}
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node, the version engines names in package.json
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Install the locked dependencies
        run: npm ci
      - name: Build the site
        run: npm run build
        env:
          # the docs every docs link points at
          NAPWAKE_DOCS_URL: https://docs.napwake.dev
          # docs links go to the docs' pages on GitHub until docs.napwake.dev serves the renamed docs, at the
          # product's next release. Delete this line then (src/lib/links.mjs)
          NAPWAKE_DOCS_MODE: github
          # for the star count, read once from GitHub's API; if it can't be read, the button says GitHub
          # and the build goes on
          GITHUB_TOKEN: ${{ github.token }}
      - name: List the sitemap's pages, for IndexNow
        id: urls
        continue-on-error: true
        run: echo "urls=$(grep -ho '<loc>[^<]*</loc>' dist/sitemap-[0-9]*.xml | sed -e 's#<loc>##' -e 's#</loc>##' | jq -Rsc 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"
      - name: Upload the site for Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/
          # for .well-known/security.txt: otherwise the action leaves out every file and folder named with a dot
          include-hidden-files: true

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Tells search engines that use IndexNow (Bing, Yandex and others) about the sitemap's pages, once the site
  # is live. The key is public/<key>.txt's. Whatever happens here, the deploy has already succeeded.
  indexnow:
    name: IndexNow
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions: {}
    steps:
      - name: Submit the sitemap's pages
        env:
          KEY: c8571cdccfa14e451300d4962baed58c
          URLS: ${{ needs.build.outputs.urls }}
        run: |
          body=$(jq -nc --arg key "$KEY" --argjson urls "$URLS" '{host: "napwake.dev", key: $key, keyLocation: "https://napwake.dev/\($key).txt", urlList: $urls}') || exit 0
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' --data "$body") || status='no answer'
          case "$status" in
            200|202) echo "IndexNow: $status, $(jq length <<< "$URLS") pages" ;;
            *) echo "::warning::IndexNow answered $status" ;;
          esac
